[package]
name = "weirdnet-ext"
description = "Weirdnet extension host: signed extension packages, install and update rules, capability grants, a per-OS process sandbox (Landlock and seccomp on Linux), and a supervisor with a gRPC broker over a private socket."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
keywords = ["extensions", "sandbox", "landlock", "seccomp", "plugins"]
categories = ["os", "network-programming"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
weirdnet-ext-proto.workspace = true
tonic.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
thiserror.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
hex.workspace = true
libp2p-identity = { version = "0.3", features = ["ed25519"] }
blake3 = "1"
sha2 = "0.11"
base64 = "0.22"
tar = { version = "0.4", default-features = false }
semver = "1"
getrandom = "0.3"
subtle = "2"
libc = "0.2"

[dev-dependencies]
tempfile = "3"
libp2p-identity = { version = "0.3", features = ["ed25519", "rand"] }
